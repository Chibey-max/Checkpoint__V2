<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Checkpoint mark in its gold socket, as in the nav: three rings (Guard, You, Vault) with the notch aligned. -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe3a6"/>
      <stop offset=".35" stop-color="#9a7536"/>
      <stop offset=".6" stop-color="#f1d48f"/>
      <stop offset="1" stop-color="#6b4f22"/>
    </linearGradient>
    <radialGradient id="face" cx=".5" cy=".36" r=".72">
      <stop offset="0" stop-color="#33281a"/>
      <stop offset="1" stop-color="#0b0905"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe6b0"/>
      <stop offset="1" stop-color="#c8923a"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31.5" fill="url(#rim)"/>
  <circle cx="32" cy="32" r="28.5" fill="url(#face)"/>
  <g fill="none" stroke-linecap="round">
    <circle cx="32" cy="32" r="21" stroke="#f3e6c8" stroke-opacity=".38" stroke-width="3.4" stroke-dasharray="105 27" transform="rotate(-62 32 32)"/>
    <circle cx="32" cy="32" r="14" stroke="#f3e6c8" stroke-opacity=".7" stroke-width="3.4" stroke-dasharray="68 20" transform="rotate(-70 32 32)"/>
    <circle cx="32" cy="32" r="7" stroke="url(#gold)" stroke-width="3.6" stroke-dasharray="34 10" transform="rotate(-80 32 32)"/>
  </g>
  <rect x="29.9" y="7.5" width="4.2" height="25" rx="2.1" fill="url(#gold)"/>
</svg>
